services:
  postgres:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rn_app}
      POSTGRES_USER: ${POSTGRES_USER:-rn_app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rn_app_password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres18_data:
