name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: rn_app
          POSTGRES_USER: rn_app_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rn_app_user -d rn_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: test
      HOST: 127.0.0.1
      PORT: 3000
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: rn_app
      PGUSER: rn_app_user
      PGPASSWORD: test_password
      PGPOOL_MAX: 5
      CORS_ORIGIN: '*'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            mobile/package-lock.json
      - name: Install API
        run: npm ci --prefix api
      - name: Install mobile
        run: npm ci --prefix mobile
      - name: Migrate and seed
        run: |
          npm run db:migrate --prefix api
          npm run db:seed --prefix api
      - name: API quality
        run: |
          npm run lint --prefix api
          npm run typecheck --prefix api
          npm test --prefix api
          npm run build --prefix api
      - name: Mobile quality
        run: |
          npm run lint --prefix mobile
          npm run typecheck --prefix mobile
          npm run test:mobile --prefix mobile -- --watch=false
